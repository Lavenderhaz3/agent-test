[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentinel"
version = "1.0.0"
description = "基于 OpenClaw + Claude + GPT 的多模型协作代码审查与安全保障智能体"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "CodeSentinel Team"}]
dependencies = [
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "pyyaml>=5.1",
    "httpx>=0.20.0",
    "rich>=10.0.0",
    "click>=7.0",
    "jinja2>=2.11",
]

[project.scripts]
codesentinel = "multi_model_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]
